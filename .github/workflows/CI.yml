name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Initialize
        uses: ./.github/actions/initialize

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Initialize
        uses: ./.github/actions/initialize

      - name: Verify module dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum dirty" && exit 1)

      - name: Run tests with race detector and coverage
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Verify package compilation
        run: go build -v ./...

