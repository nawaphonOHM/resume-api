name: DEPLOY.yml
on:
  push:
    tags:
      - 'v\d+\.\d+\.\d+'
permissions:
  id-token: write # Required for requesting the JWT/OIDC token
  contents: read  # Required for actions/checkout

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Pull Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WORKLOAD_IDENTITY_POOL }}/providers/${{ secrets.PROVIDER }}
          service_account: ${{ secrets.IMPERSONATED_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set Short SHA
        id: SHORT_SHA
        run: |
          echo "SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

      - name: Replace Parameter in cloudbuild.yaml
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
          BUILDER: ${{ vars.BUILDER }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          LOCATION: ${{ vars.LOCATION }}
          REPO_NAME: ${{ vars.REPO_NAME }}
          SERVICE_ACCOUNT: ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }}
          # Define color codes
          RED: '\033[0;31m'
          GREEN: '\033[0;32m'
          YELLOW: '\033[0;33m'
          NC: '\033[0m' # No Color / Reset

        run: |
          
          CLOUD_BUILD_PARAMS=(_IMAGE_NAME_ _SHORT_SHA_ _BUILDER_ _SERVICE_NAME_ _LOCATION_ _REPO_NAME_ _SERVICE_ACCOUNT_)
          
          for PARAM in "${CLOUD_BUILD_PARAMS[@]}"
          do
            ENV_KEY_NAME=$(echo "$PARAM" | sed -E 's/^.|.$//g')
            echo -e "$YELLOW"Replacing \'"$PARAM"\' in cloudbuild.yaml with "$ENV_KEY_NAME" env value"$NC"
            sed -i "s|$PARAM|${!ENV_KEY_NAME}|g" cloudbuild.yaml
            echo -e "$GREEN"Replacing \'"$PARAM"\' in cloudbuild.yaml with "$ENV_KEY_NAME" env value"$NC"
          done

      - name: Submit Cloud Build
        run: |
          gcloud builds submit . --gcs-source-staging-dir gs://${{ secrets.STAGING_BUCKET_NAME }}/source \
          --region ${{ vars.LOCATION }}
