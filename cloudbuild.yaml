steps:
  # Step 1: Build the Docker image and push to the registry
  - name: 'docker.io/buildpacksio/pack'
    id: 'Build Image'
    args:
      - 'build'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$_SHORT_SHA'
      - '--builder=$_BUILDER'
      - '--network=cloudbuild'
      - '--publish'

  # Step 2: Deploy the container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy to Cloud Run'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$_SHORT_SHA'
      - '--region=$_LOCATION'
      - '--platform=managed'
      - '--service-account=$_SERVICE_ACCOUNT'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--network=default'
      - '--subnet=default'
      - '--vpc-egress=all-traffic'
      - '--startup-probe=httpGet.port=8080,httpGet.path=/health,timeoutSeconds=1,periodSeconds=10,failureThreshold=3'
      - '--set-secrets=OHM9996_MONGODB_AUTH_SOURCE=API_DATA_NOSQL_AUTH_SOURCE:1'
      - '--set-secrets=OHM9996_MONGODB_DATABASE=API_DATA_NOSQL_DATABASE_NAME:1'
      - '--set-secrets=OHM9996_MONGODB_HOST=API_DATA_NOSQL_DATABASE_URL:1'
      - '--set-secrets=OHM9996_MONGODB_MAX_CONN_IDLE_TIME=API_DATA_NOSQL_MAX_CONN_IDLE_TIME:1'
      - '--set-secrets=OHM9996_MONGODB_PASSWORD=API_DATA_NOSQL_PASSWORD:1'
      - '--set-secrets=OHM9996_MONGODB_PORT=API_DATA_NOSQL_PORT:1'
      - '--set-secrets=OHM9996_MONGODB_SOCKET_TIMEOUT=API_DATA_NOSQL_SOCKET_TIMEOUT:1'
      - '--set-secrets=OHM9996_MONGODB_USERNAME=API_DATA_NOSQL_USERNAME:1'
      - '--set-secrets=OHM9996_OTEL_ENABLED=RESUME_API_OTEL_ENABLED:1'
      - '--set-secrets=OHM9996_SERVER_HOST=RESUME_API_SERVER_HOST:1'
      - '--set-secrets=OHM9996_SERVER_PORT=RESUME_API_SERVER_PORT:1'
      - '--set-secrets=OHM9996_MONGODB_ENABLE_PING=API_DATA_NOSQL_ENABLE_PING:1'
      - '--set-secrets=OHM9996_LOGGING_FORMAT=RESUME_API_FORMAT:1'
      - '--set-env-vars=OHM9996_CLOUD_PROVIDER=gcp'


options:
  logging: CLOUD_LOGGING_ONLY