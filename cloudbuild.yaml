steps:
  # Step 1: Build the Docker image and push to the registry
  - name: 'docker.io/buildpacksio/pack'
    id: 'Build Image from buildId $BUILD_ID'
    args:
      - 'build'
      - '${_IMAGE_LOCATION}'
      - '--builder=${_BUILDER}'
      - '--publish'

  # Step 2: Deploy the container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy to Cloud Run'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_IMAGE_LOCATION}'
      - '--region=$LOCATION'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--set-secrets=OHM9996_MONGODB_AUTH_SOURCE=OHM9996_MONGODB_AUTH_SOURCE:1'
      - '--set-secrets=OHM9996_MONGODB_DATABASE=OHM9996_MONGODB_DATABASE:1'
      - '--set-secrets=OHM9996_MONGODB_HOST=OHM9996_MONGODB_HOST:1'
      - '--set-secrets=OHM9996_MONGODB_MAX_CONN_IDLE_TIME=OHM9996_MONGODB_MAX_CONN_IDLE_TIME:1'
      - '--set-secrets=OHM9996_MONGODB_PASSWORD=OHM9996_MONGODB_PASSWORD:1'
      - '--set-secrets=OHM9996_MONGODB_PORT=OHM9996_MONGODB_PORT:1'
      - '--set-secrets=OHM9996_MONGODB_SOCKET_TIMEOUT=OHM9996_MONGODB_SOCKET_TIMEOUT:1'
      - '--set-secrets=OHM9996_MONGODB_USERNAME=OHM9996_MONGODB_USERNAME:1'
      - '--set-secrets=OHM9996_OTEL_ENABLED=OHM9996_OTEL_ENABLED:1'
      - '--set-secrets=OHM9996_SERVER_HOST=OHM9996_SERVER_HOST:1'
      - '--set-secrets=OHM9996_SERVER_PORT=OHM9996_SERVER_PORT:1'


# Specify which images to track in the build history
images:
  - '${_IMAGE_LOCATION}'

# Define user-defined variables (Substitutions)
substitutions:
  _IMAGE_NAME: 'resume-api'
  _REPO_NAME: 'resume-api-images'
  _SERVICE_NAME: 'resume-api-service'
  _BUILDER: 'gcr.io/buildpacks/builder:google-24'
  _IMAGE_LOCATION: '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_IMAGE_NAME}:$TAG_NAME'

options:
  logging: CLOUD_LOGGING_ONLY